##### Modern tmux config (tmux >= 3.2)

##### Terminal and behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g repeat-time 300
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g set-clipboard on
set -g detach-on-destroy off
set -g allow-rename off

##### Prefix and quality-of-life binds
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Keep working directory when creating splits/windows
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

##### Pane movement and resizing
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Copy mode (vim keys)
setw -g mode-keys vi
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command "pbcopy"'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

##### Status line and colors
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0f172a,fg=#e2e8f0"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=#38bdf8,bold] #S "
set -g status-right "#[fg=#94a3b8]%Y-%m-%d #[fg=#e2e8f0,bold]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#0f172a,bg=#38bdf8,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=#f59e0b,bold"
setw -g window-status-bell-style "fg=#ef4444,bold"
set -g pane-border-style "fg=#334155"
set -g pane-active-border-style "fg=#38bdf8"
set -g message-style "bg=#1e293b,fg=#e2e8f0"
set -g message-command-style "bg=#1e293b,fg=#38bdf8"

